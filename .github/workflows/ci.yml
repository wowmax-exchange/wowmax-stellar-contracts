name: contracts

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: rustup target add wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install the Stellar CLI
        run: |
          if ! command -v stellar >/dev/null; then
            cargo install --locked stellar-cli --version 26.0.0
          fi
          stellar version

      # One workspace-wide build first: the adapter suites import the .wasm
      # artifacts of other crates, so every artifact must exist before any
      # suite is compiled.
      - name: Build the contracts
        working-directory: contracts
        run: stellar contract build

      - name: Run every test suite
        working-directory: contracts
        run: cargo test --workspace
