<text class="bn" x="420" y="74">api-gateway</text>
<rect class="b" x="498" y="48" width="120" height="46" rx="4"/>
<text class="bn" x="558" y="68">Router v2</text><text class="bs" x="558" y="82">pathfinder builds plan</text>
<path class="e" d="M482,62 L496,62"/>
<path class="e" d="M496,80 L484,80"/>

<path class="e" d="M290,58 L358,58"/>
<text class="l" x="324" y="52" text-anchor="middle">I1</text>
