<text class="zt" x="686" y="34">PUBLIC NETWORK</text>
<rect class="b" x="690" y="48" width="120" height="46" rx="4"/>
<text class="bn" x="750" y="68">Soroban RPC</text><text class="bs" x="750" y="82">multi-provider</text>
