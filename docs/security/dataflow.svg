<path class="er" d="M652,322 L890,322 L890,538"/>
<text class="lr" x="660" y="316">I9 - TB4: scoped pre-authorization</text>
<path class="er" d="M652,358 L820,358 L820,538"/>
<text class="lr" x="660" y="352">I10 venue swap call</text>
<path class="er" d="M770,540 L770,470 L560,470 L560,380"/>
<text class="lr" x="568" y="464">I11 delivered tokens</text>

<text class="l" x="30" y="626" font-size="9.5">I1 quote request  ·  I2 route, plan and unsigned XDR  ·  I3 reserve reads  ·  I4 wallet review  ·  I6 submit</text>
<text class="l" x="30" y="642" font-size="9.5">I7 carries user, token_in, token_out, amount_in, amount_out_min, deadline and the plan  ·  I9 scopes one transfer: exact token, recipient and amount</text>
<text class="l" x="30" y="658" font-size="9.5" fill="#8a8a8a">I11: the amount a venue reports is NOT trusted - only the contract's own balance delta counts. Red = the contract consumes data it cannot trust.</text>
