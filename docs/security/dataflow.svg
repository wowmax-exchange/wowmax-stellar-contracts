<text class="bs" x="848" y="575">Soroswap, Aquarius, Phoenix</text>
<text x="848" y="590" font-size="9" font-weight="bold" text-anchor="middle" fill="#c0392b">UNTRUSTED CALLEES</text>

<path class="e" d="M328,322 L135,322 L135,538"/>
<text class="l" x="142" y="316">I8 pull input</text>
<path class="e" d="M328,358 L215,358 L215,538"/>
