<text class="bn" x="135" y="564">SAC token contracts</text><text class="bs" x="135" y="580">XLM, USDC, AQUA</text>

<rect class="b" x="750" y="540" width="196" height="60" rx="5" style="stroke:#c0392b;stroke-width:1.6"/>
